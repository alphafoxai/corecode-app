# Checks this component, and on a main push hands the commit to corecode-infra,
# which builds the image and deploys it to production.
#
# This repository is public (AGPL-3.0), and the org's self-hosted runner group
# does not admit public repositories: a fork pull request would run arbitrary
# code on a machine with production reach. Every job here therefore uses a
# GitHub-hosted runner, and the image builds in corecode-infra's release-app.yml
# on the self-hosted pool (corecode-infra
# notes/workspace/implemented/process/2026-10-26-build-the-app-image-in-infra.md).
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.corecode/**'
      - '.agents/**'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

concurrency:
  # Only a pull request cancels its own older runs. Every main push dispatches
  # its own release; corecode-infra serializes them.
  group: corecode-app-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # setup-go keys its cache on go.sum alone and skips the save on a key
          # hit, so the build cache froze at the last dependency change and every
          # later run recompiled what had changed since. The steps below replace it.
          cache: false

      # Modules change with go.sum; compiled packages and cached test results
      # change with any Go source, so the key hashes both and a miss restores the
      # closest earlier entry. Pull requests only read this cache; main and
      # manual runs write a new entry when the key misses.
      - name: Restore Go caches
        id: go-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-check-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-check-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-check-${{ runner.os }}-

      # main.go embeds web/dist, so the Go toolchain will not parse the module
      # until web/dist/index.html exists. Vet and the tests never serve the
      # console, so a placeholder satisfies the embed; the web job builds the
      # real bundle.
      - name: Stand in for the console bundle the Go build embeds
        run: |
          set -eu
          mkdir -p web/dist
          : > web/dist/index.html

      - name: Vet and test the Go module
        run: |
          # pipefail: the test output is piped to tail, and without it the step
          # takes tail's exit status, so a failing test would pass the job.
          set -euo pipefail
          go vet ./...
          go test ./common/... ./controller/... ./middleware/... ./model/... ./service/... 2>&1 | tail -40
          go test -race ./pkg/deployment ./pkg/riskpolicy

      - name: Save Go caches
        if: github.event_name != 'pull_request' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The console build is the only check of the frontend a pull request gets: the
  # image build in corecode-infra, which builds it again, never runs on one.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Build the console bundle
        working-directory: web
        run: |
          set -eu
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' bun run build

      # rsbuild transpiles without type-checking, so a dependency bump that
      # changes an API's shape builds, passes the tests, and fails only at
      # runtime. @tanstack/react-router 1.170.46 did that to getMatchedRoutes.
      - name: Type-check the console
        working-directory: web
        run: bun run typecheck

      # oxlint against web/lint-baseline.json: the upstream console does not
      # lint clean, so this fails only on findings the baseline does not record.
      - name: Check for new lint findings
        working-directory: web
        run: bun run lint:check

      # What a cold visit downloads before each core page renders, against
      # web/first-load-budget.json: an import that pulls a page into the entry
      # passes review and the build but fails here.
      - name: Check the core pages' first-load size
        working-directory: web
        run: bun run first-load:check

  # Releases from main only. corecode-infra builds the commit while check and web
  # run, refuses a commit that is not on main, and deploys once both pass, so
  # this job starts with them rather than after them. The token is scoped to
  # corecode-infra, and a fork pull request never receives it.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hand the commit to corecode-infra
        env:
          GH_TOKEN: ${{ secrets.CORECODE_INFRA_DISPATCH_TOKEN }}
        run: |
          set -eu
          gh workflow run release-app.yml --repo CoreCodeAI/corecode-infra --ref main -f sha="$GITHUB_SHA"
          echo "::notice title=Release::https://github.com/CoreCodeAI/corecode-infra/actions/workflows/release-app.yml"
