# Builds this component's image and pushes it to Artifact Registry.
#
# It does not deploy. The relay pulls whatever tag corecode-infra pins, so a
# release is two reviewable steps: publish the image here, move the pin there.
# That is what keeps one component's release from rolling its neighbours.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.corecode/**'
      - '.agents/**'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

concurrency:
  group: corecode-app-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

env:
  PROJECT: alphafox-506201
  REGION: us-east1
  IMAGE: us-east1-docker.pkg.dev/alphafox-506201/derouter/new-api

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The web console is a separate Bun build inside this module; the Go tests
      # do not need it, so it is only built in the publish job.
      - name: Vet and test the Go module
        run: |
          set -eu
          go vet ./...
          go test ./common/... ./controller/... ./middleware/... ./model/... ./service/... 2>&1 | tail -40

  publish:
    needs: [check]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/158507354296/locations/global/workloadIdentityPools/github-actions-pool/providers/github-derouter
          service_account: derouter-build@alphafox-506201.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # The tag is <package version>-<commit>, read from the tree so a rerun of
      # the same commit republishes the same tag.
      - name: Resolve version
        id: version
        run: |
          set -eu
          version=$(grep -m1 -oE 'VERSION *= *"[^"]+"' common/constants.go 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^"]*' || echo '0.0.0')
          echo "version=${version:-0.0.0}" >> "$GITHUB_OUTPUT"

      # Built from this checkout, not from a GitHub ref: the tree is the source of
      # truth now, and cloudbuild/ in corecode-infra still clones the old fork.
      - name: Build and push
        run: |
          set -eu
          tag="${{ steps.version.outputs.version }}-$(git rev-parse --short=8 HEAD)"
          gcloud builds submit . --tag "$IMAGE:$tag" \
            --region "$REGION" --project "$PROJECT" \
            --service-account "projects/$PROJECT/serviceAccounts/derouter-build@$PROJECT.iam.gserviceaccount.com" \
            --gcs-source-staging-dir "gs://${PROJECT}_us-east1_cloudbuild/source"
          echo "published $IMAGE:$tag"

      - name: Report the pin to move
        run: |
          set -eu
          tag="${{ steps.version.outputs.version }}-$(git rev-parse --short=8 HEAD)"
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this in corecode-infra \`docker-compose.yml\`:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "new-api:$tag" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
