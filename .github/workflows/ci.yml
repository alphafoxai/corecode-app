# Builds this component's image, pushes it to Artifact Registry, and on a main
# push deploys it to production.
#
# This repository is public (AGPL-3.0), and the org's self-hosted runner group
# does not admit public repositories: a fork pull request would run arbitrary
# code on a machine with production reach. Every job here therefore uses a
# GitHub-hosted runner.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.corecode/**'
      - '.agents/**'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

concurrency:
  # Only a pull request cancels its own older runs. A main push must not cancel
  # an in-flight deploy: cancelling mid-rollout leaves the container created but
  # never started.
  group: corecode-app-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

env:
  PROJECT: alphafox-506201
  REGION: us-east1
  IMAGE: us-east1-docker.pkg.dev/alphafox-506201/derouter/new-api
  # Buildx writes an OCI build record per build; nobody imports it, and it counts
  # against the org's Actions storage quota.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  DOCKER_BUILD_SUMMARY: 'false'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # setup-go keys its cache on go.sum alone and skips the save on a key
          # hit, so the build cache froze at the last dependency change and every
          # later run recompiled what had changed since. The steps below replace it.
          cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Modules change with go.sum; compiled packages and cached test results
      # change with any Go source, so the key hashes both and a miss restores the
      # closest earlier entry. Pull requests only read these caches; main and
      # manual runs write a new entry when the key misses. Bun's package cache
      # follows the lockfile.
      - name: Restore Go caches
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-check-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-check-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-check-${{ runner.os }}-

      - name: Restore Bun package cache
        id: bun-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-check-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-check-${{ runner.os }}-

      # main.go embeds web/dist, so the Go toolchain will not even parse the
      # module until the console bundle exists. Building it here is a build
      # prerequisite, not a duplicate of the publish job's image build.
      - name: Build the console bundle the Go build embeds
        working-directory: web
        run: |
          set -eu
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' bun run build

      - name: Vet and test the Go module
        run: |
          set -eu
          go vet ./...
          go test ./common/... ./controller/... ./middleware/... ./model/... ./service/... 2>&1 | tail -40
          go test -race ./pkg/deployment

      - name: Save Go caches
        if: github.event_name != 'pull_request' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - name: Save Bun package cache
        if: github.event_name != 'pull_request' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

  publish:
    needs: [check]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        id: auth
        with:
          token_format: access_token
          workload_identity_provider: projects/158507354296/locations/global/workloadIdentityPools/github-actions-pool/providers/github-derouter
          service_account: derouter-build@alphafox-506201.iam.gserviceaccount.com

      - uses: docker/setup-buildx-action@v3
        id: buildx

      # The Dockerfile's cache mounts (Go modules, Go build cache, Bun packages)
      # live in the builder, and a hosted runner starts with an empty one: the
      # registry layer cache skipped `go mod download`, so `go build` downloaded
      # every module again and compiled every package from scratch. The cache
      # dance copies the mounts in from the Actions cache before the build and
      # back out after it. Post steps run in reverse order, so the extraction
      # finishes before actions/cache saves. The directories sit in RUNNER_TEMP
      # so they never enter the Docker build context. The key follows the same
      # rule as the check job's: dependencies plus Go sources, and an exact hit
      # skips both the extraction and the save.
      - name: Restore build cache mounts
        id: mount-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cache-mounts
          key: docker-mounts-${{ hashFiles('go.sum', 'web/bun.lock') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            docker-mounts-${{ hashFiles('go.sum', 'web/bun.lock') }}-
            docker-mounts-

      - name: Inject build cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          scratch-dir: ${{ runner.temp }}/cache-dance-scratch
          skip-extraction: ${{ steps.mount-cache.outputs.cache-hit }}
          cache-map: |
            {
              "${{ runner.temp }}/cache-mounts/go-mod": {"target": "/go/pkg/mod", "id": "new-api-go-mod"},
              "${{ runner.temp }}/cache-mounts/go-build": {"target": "/root/.cache/go-build", "id": "new-api-go-build"},
              "${{ runner.temp }}/cache-mounts/bun": {"target": "/root/.bun/install/cache", "id": "new-api-bun"}
            }

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-east1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # The tag is <version>-<commit>: the version from the tree, the commit for
      # uniqueness, so a rerun of the same commit republishes the same tag.
      # The tree carries no version: VERSION is empty and common.Version is the
      # v0.0.0 placeholder, because upstream injects both at build time. Derive a
      # sortable version from the commit date so a tag says when it was built,
      # and write it into VERSION so the image and the console bundle agree.
      - name: Resolve version
        id: version
        run: |
          set -eu
          version="$(git show -s --format=%cd --date=format:%Y.%m.%d HEAD)"
          printf '%s' "$version" > VERSION
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "derived version $version from the commit date"

      - name: Record the tag
        id: tag
        run: echo "tag=${{ steps.version.outputs.version }}-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      # A hosted runner has no builder state that survives between runs, so the
      # layer cache lives in the registry under a second tag. mode=max keeps the
      # intermediate stages too: this image builds the web bundle before the Go
      # binary, and both stages are worth reusing. The cache mounts above are a
      # separate store; layers here, mount contents in the Actions cache.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:buildcache
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          provenance: false
          sbom: false

  # Production deploys from main only, after the image is published.
  #
  # This repository is public, and the org's self-hosted runner group does not
  # admit public repositories, so this job uses a hosted runner. The symptom of
  # getting that wrong is not an error: the job queues forever with no runner
  # assigned. `environment: production` still makes every rollout a deliberate
  # act rather than a side effect of merging.
  deploy:
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: corecode-app-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The runner's metadata identity belongs to the machine, not to this
      # repository, so the job authenticates the same way every other job does.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/158507354296/locations/global/workloadIdentityPools/github-actions-pool/providers/github-derouter
          service_account: derouter-ci@alphafox-506201.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # The key exists only inside this step: written to RUNNER_TEMP with 0600,
      # removed by the script's own trap, and never exported to another step.
      - name: Deploy to the relay
        env:
          RELAY_SSH_KEY_FILE: ${{ runner.temp }}/relay_key
          RELAY_SSH_KEY_SECRET: ${{ secrets.CORECODE_RELAY_SSH_KEY }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -eu
          umask 077
          printf '%s\n' "$RELAY_SSH_KEY_SECRET" > "$RELAY_SSH_KEY_FILE"
          RELAY_SSH_KEY="$RELAY_SSH_KEY_FILE" sh scripts/deploy-service.sh "$TAG" new-api
