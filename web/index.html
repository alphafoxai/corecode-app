<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>CoreCode</title>
    <meta name="title" content="CoreCode" />
    <meta
      name="description"
      content="CoreCode 是 Claude Code 中转：每个请求都由 Anthropic 官方 Claude 账号作答，不换模型，不掺别家。"
    />
    <!-- Search engines and link previews read these static tags; the
         runtime favicon from /api/status only reaches browsers that run JS.
         rsbuild injects the /favicon.ico link from html.favicon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#faf9f5" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!-- Send the page load's first API requests while the bundle downloads,
         instead of after it has run: the status, the setup check and, when
         the app would send it anyway, the auth refresh (a session hint
         cookie, or the sign-in page, which checks for a usable Refresh
         Cookie), then the overview's or keys page's first data.
         src/lib/boot-requests.ts hands each response to the code that would
         otherwise make the request. Keep the conditions in sync with
         bootstrapAuthentication and the sign-in route. -->
    <script>
      ;(function () {
        function send(url, init) {
          var options = { cache: 'no-store', credentials: 'same-origin' }
          for (var key in init) options[key] = init[key]
          return fetch(url, options).then(
            function (response) {
              return response.json().then(
                function (data) {
                  return { status: response.status, data: data }
                },
                function () {
                  return { status: response.status }
                }
              )
            },
            function () {
              return { status: 0 }
            }
          )
        }
        try {
          var path = location.pathname
          var boot = (window.__bootRequests = { status: send('/api/status') })
          if (path.indexOf('/setup') !== 0) {
            boot.setup = send('/api/setup?t=' + Date.now())
          }
          if (
            /(^|; *)new_api_has_session=/.test(document.cookie) ||
            path === '/sign-in'
          ) {
            boot.refresh = send('/api/user/auth/refresh', { method: 'POST' })
          }
          // The first data of the overview and the keys page, fetched with the
          // refresh's access token as soon as it returns. Each URL must equal
          // the one the page requests: prefetchCustomerOverview (with
          // dailySpendRange), the balance card's subscriptions, the uptime
          // panel and prefetchApiKeys (src/lib/boot-requests.test.ts checks
          // them).
          var page = path.replace(/[/]+$/, '')
          var urls = []
          if (page === '/dashboard' || page === '/dashboard/overview') {
            var start = new Date()
            start.setHours(0, 0, 0, 0)
            start.setDate(start.getDate() - 13)
            var end = new Date()
            end.setHours(23, 59, 59, 999)
            urls = [
              '/api/data/self?start_timestamp=' +
                Math.floor(start.getTime() / 1000) +
                '&end_timestamp=' +
                Math.floor(end.getTime() / 1000) +
                '&default_time=hour',
              '/api/log/self?p=1&page_size=100&type=2',
              '/api/token/?p=1&size=50',
              '/api/perf-metrics/summary?hours=24',
              '/api/subscription/self',
              '/api/uptime/status',
            ]
          } else if (page === '/keys' && !location.search) {
            var size = 20
            try {
              var stored = parseInt(localStorage.getItem('page-size'), 10)
              if (stored > 0) size = stored
            } catch (e) {}
            urls = ['/api/token/?p=1&size=' + size]
          }
          if (boot.refresh && urls.length) {
            var token = boot.refresh.then(function (r) {
              return r.status === 200 && r.data && r.data.data
                ? r.data.data.access_token
                : null
            })
            boot.data = {}
            urls.forEach(function (url) {
              boot.data[url] = token.then(function (value) {
                return value
                  ? send(url, { headers: { Authorization: 'Bearer ' + value } })
                  : { status: 0 }
              })
            })
          }
        } catch (e) {}
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
